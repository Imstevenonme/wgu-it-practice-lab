  {
    "id": "c136",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 2.4: Software Development",
    "term": "proprietary software",
    "definition": "software that is owned by a company, requires payment to use it, and cannot be changed or shared; examples include Microsoft Office and Adobe Photoshop"
  },
  {
    "id": "c137",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 2.4: Software Development",
    "term": "software development",
    "definition": "the process of creating computer programs and apps that help you do things on a computer"
  },
  {
    "id": "c138",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 2.4: Software Development",
    "term": "waterfall methodology",
    "definition": "a step-by-step method for developing software, where each stage must be completed before the next one starts"
  },
  {
    "id": "c139",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.1: Fundamentals of Computer Networking",
    "term": "Local area networks (LAN)",
    "definition": "connect computers within a single office or building, while"
  },
  {
    "id": "c140",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.1: Fundamentals of Computer Networking",
    "term": "wide-area networks (WAN)",
    "definition": "span multiple locations, linking businesses and data centers globally."
  },
  {
    "id": "c141",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.1: Fundamentals of Computer Networking",
    "term": "Business applications",
    "definition": "Networks enable customer management systems, inventory tracking, and cloud-based tools that improve efficiency."
  },
  {
    "id": "c142",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.1: Fundamentals of Computer Networking",
    "term": "Collaboration and communication",
    "definition": "Employees use networks to exchange emails, participate in video calls, and work on shared documents in real time."
  },
  {
    "id": "c143",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.1: Fundamentals of Computer Networking",
    "term": "Operational efficiency",
    "definition": "By connecting databases, cloud platforms, and software applications, networks streamline processes and ensure access to accurate, real-time information."
  },
  {
    "id": "c144",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.1: Fundamentals of Computer Networking",
    "term": "Remote access",
    "definition": "Cloud-based networks provide employees with secure access to company resources from anywhere, supporting flexible and hybrid work environments."
  },
  {
    "id": "c145",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.1: Fundamentals of Computer Networking",
    "term": "Router",
    "definition": "directs data between different networks and provides internet access"
  },
  {
    "id": "c146",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.1: Fundamentals of Computer Networking",
    "term": "Switch",
    "definition": "connects multiple devices within a local network, ensuring fast and efficient data transfer"
  },
  {
    "id": "c147",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.1: Fundamentals of Computer Networking",
    "term": "Modem",
    "definition": "converts digital data into signals for internet access, enabling communication with an internet service provider (ISP)"
  },
  {
    "id": "c148",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.1: Fundamentals of Computer Networking",
    "term": "Network interface card (NIC)",
    "definition": "a hardware component that allows a computer or device to connect to a network via wired or wireless communication"
  },
  {
    "id": "c149",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.1: Fundamentals of Computer Networking",
    "term": "Network topology",
    "definition": "refers to the physical and logical layout of how different devices are connected within a network. It defines the arrangement and interconnection of devices like computers, routers, and switches to enable data flow between them. The design of the network impacts its performance, scalability, and reliability. There are several network topologies, but the most commonly used are the following:"
  },
  {
    "id": "c150",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.1: Fundamentals of Computer Networking",
    "term": "Star topology",
    "definition": "Devices are connected to a central hub or switch."
  },
  {
    "id": "c151",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.1: Fundamentals of Computer Networking",
    "term": "Mesh topology",
    "definition": "Devices are interconnected, where each device is directly connected to every other device."
  },
  {
    "id": "c152",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.1: Fundamentals of Computer Networking",
    "term": "Point-to-point topology",
    "definition": "This is a direct connection between two devices."
  },
  {
    "id": "c153",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.1: Fundamentals of Computer Networking",
    "term": "Bus topology",
    "definition": "A single backbone cable connects all devices."
  },
  {
    "id": "c154",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.1: Fundamentals of Computer Networking",
    "term": "Ring topology",
    "definition": "Devices are connected in a circular manner, each device linking to two others."
  },
  {
    "id": "c155",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.1: Fundamentals of Computer Networking",
    "term": "Tree topology",
    "definition": "This is a hybrid of star and bus, where groups of star networks are connected in a hierarchical manner."
  },
  {
    "id": "c156",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.1: Fundamentals of Computer Networking",
    "term": "cellular network",
    "definition": "a wireless network used for mobile communication, connecting mobile devices through cell towers"
  },
  {
    "id": "c157",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.1: Fundamentals of Computer Networking",
    "term": "local area network (LAN)",
    "definition": "a network that connects computers and devices within a limited geographic area, such as a building or campus"
  },
  {
    "id": "c158",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.1: Fundamentals of Computer Networking",
    "term": "satellite network",
    "definition": "a type of network that uses satellites to provide internet or communication services, especially in remote areas"
  },
  {
    "id": "c159",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.1: Fundamentals of Computer Networking",
    "term": "virtual local area network (VLAN)",
    "definition": "a logical grouping of devices within a LAN, segmented to improve traffic management and security"
  },
  {
    "id": "c160",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.1: Fundamentals of Computer Networking",
    "term": "virtual private network (VPN)",
    "definition": "a secure connection method that allows users to send data securely over public networks, often used to connect remote workers to a company network"
  },
  {
    "id": "c161",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.1: Fundamentals of Computer Networking",
    "term": "wide area network (WAN)",
    "definition": "a network that covers a large geographic area, connecting LANs across cities, countries, or even continents"
  },
  {
    "id": "c162",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.2: Networks and Communication",
    "term": "Transmission media",
    "definition": "refers to the physical or logical pathways through which data travels within a network. It is categorized into two primary types: wired communication and wireless communication."
  },
  {
    "id": "c163",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.2: Networks and Communication",
    "term": "Wired communication",
    "definition": "relies on physical cables, such as coaxial cables, fiber-optic cables, and twisted-pair wires, to transmit data. This method is known for providing high-speed and reliable connections with minimal interference. However, it requires extensive infrastructure and lacks flexibility, making mobility more challenging."
  },
  {
    "id": "c164",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.2: Networks and Communication",
    "term": "internet",
    "definition": "is a global network of interconnected computers and devices that communicate with each other using standardized protocols. One key concept for understanding how data travels through the internet is the"
  },
  {
    "id": "c165",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.2: Networks and Communication",
    "term": "transmission control protocol (TCP)/internet protocol (IP)",
    "definition": "model, which helps standardize how different devices communicate. Another essential concept is the"
  },
  {
    "id": "c166",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.2: Networks and Communication",
    "term": "HTTP (hypertext transfer protocol)",
    "definition": "HTTP is used for transferring web pages and data on the internet. For example, when you access a website, HTTP retrieves and displays the content in your browser."
  },
  {
    "id": "c167",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.2: Networks and Communication",
    "term": "SMTP (simple mail transfer protocol)",
    "definition": "SMTP facilitates the sending of emails between servers. It is used for email delivery from one server to another."
  },
  {
    "id": "c168",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.2: Networks and Communication",
    "term": "FTP (file transfer protocol)",
    "definition": "FTP is used for transferring files between computers over a network. It allows users to upload or download files from servers."
  },
  {
    "id": "c169",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.2: Networks and Communication",
    "term": "file transfer protocol (FTP)",
    "definition": "a standard network protocol used to transfer files from one host to another over a TCP/IP-based network, like the internet"
  },
  {
    "id": "c170",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.2: Networks and Communication",
    "term": "hypertext transfer protocol (HTTP)",
    "definition": "a protocol used for transferring hypertext requests and information on the World Wide Web, enabling communication between web browsers and servers"
  },
  {
    "id": "c171",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.2: Networks and Communication",
    "term": "internet protocol (IP)",
    "definition": "a set of rules for addressing and routing data packets so that they can travel across networks and reach their destination"
  },
  {
    "id": "c172",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.2: Networks and Communication",
    "term": "open systems interconnection (OSI) model",
    "definition": "a conceptual framework that standardizes network communication into seven layers, helping to understand and troubleshoot network processes"
  },
  {
    "id": "c173",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.2: Networks and Communication",
    "term": "simple mail transfer protocol (SMTP)",
    "definition": "a protocol used for sending emails between servers, typically used for sending messages from an email client to a mail server"
  },
  {
    "id": "c174",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.2: Networks and Communication",
    "term": "transmission control protocol (TCP)",
    "definition": "a protocol used to ensure reliable transmission of data over a network by dividing data into packets and ensuring their correct delivery"
  },
  {
    "id": "c175",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.2: Networks and Communication",
    "term": "wireless communication",
    "definition": "a method of data transmission that uses radio waves, microwaves, or infrared signals to send information without physical cables"
  },
  {
    "id": "c176",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.3: Databases and Data Management",
    "term": "database management system (DBMS)",
    "definition": "is a software system designed to store, manage, and organize data in a structured way. It allows users to efficiently access, update, and manage data stored in databases. The main function of a DBMS is to provide a centralized platform for handling large volumes of data and ensuring its integrity and security."
  },
  {
    "id": "c177",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.3: Databases and Data Management",
    "term": "Metadata",
    "definition": "refers to data that describes other data, helping databases maintain structure and context for better data retrieval. By integrating these technologies, databases become more efficient and intelligent, improving overall business operations."
  },
  {
    "id": "c178",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.3: Databases and Data Management",
    "term": "Alphanumeric data",
    "definition": "This consists of numbers, letters, characters, and symbols. It is commonly used in text documents, databases, and programming languages."
  },
  {
    "id": "c179",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.3: Databases and Data Management",
    "term": "Audio data",
    "definition": "This represents sound or audio signals and is frequently used in voice recordings, digital assistants, and music streaming."
  },
  {
    "id": "c180",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.3: Databases and Data Management",
    "term": "Image data",
    "definition": "This comprises visual content such as pictures and graphics and is essential in photography, medical imaging, and facial recognition technology."
  },
  {
    "id": "c181",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.3: Databases and Data Management",
    "term": "Video data",
    "definition": "This represents moving visual content combined with audio. It is widely used in video conferencing, online streaming, and digital marketing."
  },
  {
    "id": "c182",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.3: Databases and Data Management",
    "term": "data, information, knowledge, and wisdom (DIKW) hierarchy",
    "definition": "is used to describe the process of transforming raw data into actionable insights through proper management and analysis."
  },
  {
    "id": "c183",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.3: Databases and Data Management",
    "term": "Data tables",
    "definition": "are organized collections of data, typically consisting of rows and columns. Each row represents a record, and each column represents a specific attribute of that record. Their main function is to structure data in a way that allows for easy retrieval, management, and analysis within a database system."
  },
  {
    "id": "c184",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.3: Databases and Data Management",
    "term": "data, information, knowledge, wisdom (DIKW) hierarchy",
    "definition": "a framework that organizes data into a hierarchical structure, where data is raw facts, information is processed data, knowledge is derived from information, and wisdom is the application of knowledge"
  },
  {
    "id": "c185",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.3: Databases and Data Management",
    "term": "relational database model",
    "definition": "a type of database structure that organizes data into tables linked by relationships, allowing for easy querying and management of related data"
  },
  {
    "id": "c186",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.4: Cloud Computing",
    "term": "Public cloud",
    "definition": "Cloud services are provided over the internet and shared among multiple users. Examples include Amazon Web Services (AWS) and Microsoft Azure."
  },
  {
    "id": "c187",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.4: Cloud Computing",
    "term": "Private cloud",
    "definition": "Resources are dedicated to a single organization, offering enhanced control and security. This model is ideal for businesses handling sensitive data."
  },
  {
    "id": "c188",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.4: Cloud Computing",
    "term": "Hybrid cloud",
    "definition": "A combination of public and private cloud services, allowing organizations to balance flexibility and security. Businesses can store critical data in a private cloud while utilizing the scalability of the public cloud."
  },
  {
    "id": "c189",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.4: Cloud Computing",
    "term": "desktop as a service (DaaS)",
    "definition": "are three other commonly used cloud service models. The following table, \"Cloud Service Models,\" provides a comparison of the different types of cloud service models."
  },
  {
    "id": "c190",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.4: Cloud Computing",
    "term": "hybrid cloud computing",
    "definition": "a combination of public and private cloud computing services, allowing for data and applications to be shared between them"
  },
  {
    "id": "c191",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.4: Cloud Computing",
    "term": "infrastructure as a service (IaaS)",
    "definition": "a cloud computing model where virtualized computing resources, such as servers and storage, are provided over the internet"
  },
  {
    "id": "c192",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.4: Cloud Computing",
    "term": "platform as a service (PaaS)",
    "definition": "a cloud computing model that provides a platform allowing customers to develop, run, and manage applications without managing the underlying infrastructure"
  },
  {
    "id": "c193",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.4: Cloud Computing",
    "term": "private cloud computing",
    "definition": "cloud services hosted within an organization's own data center and available only to the organization's users"
  },
  {
    "id": "c194",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 3.4: Cloud Computing",
    "term": "public cloud computing",
    "definition": "cloud services provided over the internet that are available to the general public and hosted by third-party vendors"
  },
  {
    "id": "c195",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 4.1: Information Security in IT Infrastructure",
    "term": "confidentiality",
    "definition": "prevents unauthorized access to sensitive data by ensuring that only authorized individuals can view it"
  },
  {
    "id": "c196",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 4.1: Information Security in IT Infrastructure",
    "term": "integrity",
    "definition": "maintains data accuracy and reliability by preventing unauthorized modification, deletion, or corruption"
  },
  {
    "id": "c197",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 4.1: Information Security in IT Infrastructure",
    "term": "availability",
    "definition": "ensures that data and resources are accessible when needed by authorized users, minimizing disruptions"
  },
  {
    "id": "c198",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 4.1: Information Security in IT Infrastructure",
    "term": "CIA triad",
    "definition": "a foundational concept in information security that consists of three key principles—confidentiality, integrity, and availability—aimed at protecting sensitive data and ensuring its security"
  },
  {
    "id": "c199",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 4.2: Strategies to Secure Information",
    "term": "Authentication",
    "definition": "is the process of verifying the identity of a user or entity before granting access to a system or resource. This security measure helps prevent unauthorized access, ensuring that only legitimate users interact with sensitive data."
  },
  {
    "id": "c200",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 4.2: Strategies to Secure Information",
    "term": "Access control",
    "definition": "is a security measure that determines who is allowed to access specific data, systems, or resources within an organization. It helps protect sensitive information by restricting access to authorized individuals and preventing unauthorized users from gaining entry."
  },
  {
    "id": "c201",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 4.2: Strategies to Secure Information",
    "term": "Encryption",
    "definition": "is a method of converting data into a secret code to protect it from unauthorized access. It involves using algorithms to scramble the original information into an unreadable format, known as ciphertext, which can only be deciphered by someone with the correct decryption key."
  },
  {
    "id": "c202",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 4.2: Strategies to Secure Information",
    "term": "backup",
    "definition": "is a copy of data that is created and stored separately from the original data to protect against data loss or corruption. It is used as a safety measure to ensure that important information can be recovered in case of accidental deletion, hardware failure, cyberattacks, or other disasters."
  },
  {
    "id": "c203",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 4.2: Strategies to Secure Information",
    "term": "Hot site",
    "definition": "A hot site is a fully operational backup facility that is equipped with all necessary hardware, software, and data to quickly resume operations in case of a disaster. It is the most expensive type of backup solution but offers the fastest recovery time."
  },
  {
    "id": "c204",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 4.2: Strategies to Secure Information",
    "term": "Warm site",
    "definition": "A warm site is a backup facility that is partially equipped with hardware and software but may require additional setup and configuration before it can be fully operational. It is less expensive than a hot site but offers a faster recovery time compared to a cold site."
  },
  {
    "id": "c205",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 4.2: Strategies to Secure Information",
    "term": "Cold site",
    "definition": "A cold site is a backup facility that only provides the physical space and basic infrastructure for data recovery. It lacks the necessary hardware, software, and data, which need to be set up and installed before operations can resume. It is the least expensive type of backup solution but has the longest recovery time."
  },
  {
    "id": "c206",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 4.2: Strategies to Secure Information",
    "term": "firewall",
    "definition": "is a network security device that monitors and controls incoming and outgoing network traffic based on predetermined security rules. It acts as a barrier between a trusted internal network and untrusted external networks, such as the internet, to prevent unauthorized access and protect against cyber threats."
  },
  {
    "id": "c207",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 4.2: Strategies to Secure Information",
    "term": "Data analysis",
    "definition": "means looking at large amounts of information to see common patterns and notice when something is different."
  },
  {
    "id": "c208",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 4.2: Strategies to Secure Information",
    "term": "backups",
    "definition": "copies of data stored in a separate location"
  },
  {
    "id": "c209",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 4.2: Strategies to Secure Information",
    "term": "physical security",
    "definition": "the measures taken to protect physical assets, like computers, servers, and buildings"
  },
  {
    "id": "c210",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 4.3: Cybersecurity Principles and Practices",
    "term": "FISMA (Federal Information Security Modernization Act)",
    "definition": "applies to U.S. federal agencies and requires them to implement security controls to protect government data."
  },
  {
    "id": "c211",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 4.3: Cybersecurity Principles and Practices",
    "term": "HIPAA (Health Insurance Portability and Accountability Act)",
    "definition": "sets standards for protecting patient health information."
  },
  {
    "id": "c212",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 4.3: Cybersecurity Principles and Practices",
    "term": "SOX (Sarbanes–Oxley Act)",
    "definition": "focuses on financial reporting and data security for publicly traded companies."
  },
  {
    "id": "c213",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 4.3: Cybersecurity Principles and Practices",
    "term": "FERPA (Family Educational Rights and Privacy Act)",
    "definition": "protects the privacy of student education records. The SEC Cybersecurity rule outlines cybersecurity requirements for publicly traded companies."
  },
  {
    "id": "c214",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 4.3: Cybersecurity Principles and Practices",
    "term": "GDPR (General Data Protection Regulation)",
    "definition": "is a European Union law that sets strict rules for handling personal data. These laws ensure that organizations take data protection seriously and face consequences if they fail to comply."
  },
  {
    "id": "c215",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 4.3: Cybersecurity Principles and Practices",
    "term": "PCI DSS (Payment Card Industry Data Security Standard)",
    "definition": "is a prime example. It is a set of security requirements designed to protect credit card data. Any business that processes, stores, or transmits credit card information must comply with PCI DSS. These standards help to build trust with customers and reduce the risk of data breaches."
  },
  {
    "id": "c216",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 4.3: Cybersecurity Principles and Practices",
    "term": "assets",
    "definition": "resources within an organization, such as data, systems, or devices, that need protection from security threats"
  },
  {
    "id": "c217",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 4.3: Cybersecurity Principles and Practices",
    "term": "controls",
    "definition": "security measures or policies designed to protect assets by preventing, detecting, or responding to threats and vulnerabilities"
  },
  {
    "id": "c218",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 4.3: Cybersecurity Principles and Practices",
    "term": "GRC (Governance, Regulation, and Compliance)",
    "definition": "a framework that organizations use to align security policies with legal and industry requirements while managing risks effectively"
  },
  {
    "id": "c219",
    "section": "Section 2: Technology Infrastructure and Security",
    "unit": "Unit 4.3: Cybersecurity Principles and Practices",
    "term": "threats",
    "definition": "potential dangers that could exploit weaknesses in a system, leading to unauthorized access, data breaches, or system disruptions"
  },
  {

    function renderPractice(){let q=session[currentIndex],sel=answers[q.id],show=revealed[q.id];app.innerHTML=`<div class="page quiz"><div class="quizbar"><div><button id="exit">← Exit session</button><span>${esc(q.section)}</span></div><strong>${currentIndex+1} / ${session.length}</strong></div><div class="track"><i style="width:${(currentIndex+1)/session.length*100}%"></i></div><section class="card question"><div class="meta"><b>${q.skill}</b><span>${esc(q.unit)}</span></div><h1>${esc(q.prompt)}</h1><div class="options">${q.options.map((o,i)=>`<button class="option ${sel===o?"chosen":""} ${show&&o===q.answer?"correct":""} ${show&&sel===o&&o!==q.answer?"wrong":""}" data-option="${i}"><span>${String.fromCharCode(65+i)}</span><p>${esc(o)}</p></button>`).join("")}</div>${show?`<div class="feedback ${sel===q.answer?"good":"bad"}"><strong>${sel===q.answer?"Correct":"Not quite"}</strong><br>${esc(q.explanation)}</div>`:""}<div class="qfoot"><div class="source">SOURCE<strong>${esc(q.section)} · ${esc(q.unit)}</strong></div><button class="primary" id="next" ${!sel?"disabled":""}>${currentIndex===session.length-1?"Finish session":"Next question"} →</button></div></section><div class="jump">${session.map((x,i)=>`<button data-jump="${i}" class="${answers[x.id]?"done":""} ${i===currentIndex?"now":""}">${i+1}</button>`).join("")}</div></div>`;document.getElementById("exit").onclick=()=>setView("dashboard");document.querySelectorAll("[data-option]").forEach(b=>b.onclick=()=>choose(q.options[+b.dataset.option]));document.getElementById("next").onclick=next;document.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{currentIndex=+b.dataset.jump;renderPractice()})}
    function renderResults(){let score=session.filter(q=>answers[q.id]===q.answer).length,missed=session.filter(q=>answers[q.id]!==q.answer);app.innerHTML=`<div class="page"><section class="card result"><div class="eyebrow">Session complete</div><h1>${score} / ${session.length}</h1><p>${score/session.length>=.8?"Strong work. Keep rotating topics to lock it in.":"Review the misses below, then run another focused batch."}</p><button class="primary" id="again">Practice another batch →</button></section><section class="card review"><h2>Review missed questions</h2>${missed.length?missed.map(q=>`<article><small>${esc(q.unit)}</small><h3>${esc(q.prompt)}</h3><p><b>Correct answer:</b> ${esc(q.answer)}</p><p>${esc(q.explanation)}</p></article>`).join(""):`<div class="empty">Perfect batch—nothing to review.</div>`}</section></div>`;document.getElementById("again").onclick=start}
    function renderCoverage(){let all=concepts(),groups=[...new Set(all.map(c=>c.section))];app.innerHTML=`<div class="page"><div class="title"><div class="eyebrow">Traceable question bank</div><h1>Course coverage</h1><p>Every concept and question keeps its source section and learning-page label.</p></div><div class="coverage">${groups.map(g=>{let cs=all.filter(c=>c.section===g),us=[...new Set(cs.map(c=>c.unit))];return`<section class="card"><header><h2>${esc(g)}</h2><p>${cs.length} concepts · ${cs.length*6} questions</p></header><div class="units">${us.map(u=>{let uc=cs.filter(c=>c.unit===u),practiced=uc.filter(c=>stats.attempted.some(id=>id.startsWith(c.id+"-"))).length;return`<button class="unit" data-sec="${esc(g)}" data-unit="${esc(u)}"><span><strong>${esc(u)}</strong><small>${uc.length} concepts · ${uc.length*6} questions</small></span><span>${practiced?`${practiced}/${uc.length} practiced`:"Not started"}</span></button>`}).join("")}</div></section>`}).join("")}</div></div>`;document.querySelectorAll(".unit").forEach(b=>b.onclick=()=>{section=b.dataset.sec;unit=b.dataset.unit;setView("dashboard")})}
    function renderLibrary(){app.innerHTML=`<div class="page"><div class="title"><div class="eyebrow">Reusable for future courses</div><h1>Add your own material</h1><p>Paste structured notes. Each concept creates six questions and stays on this device.</p></div><section class="card import"><h2>Paste concepts</h2><p class="sub" style="margin-left:0">Use one line per concept. The first two fields are required.</p><div class="format"><b>Format:</b> Term | Definition | Section | Unit</div><textarea id="material" placeholder="Cloud elasticity | The ability to increase or reduce resources as demand changes | Cloud Fundamentals | Scaling&#10;Authentication: The process of verifying an identity"></textarea><div class="importfoot"><span id="msg">Your material is saved locally and syncs when you sign in.</span><button class="primary" id="add">Add to question bank →</button></div></section></div>`;document.getElementById("add").onclick=()=>{let rows=document.getElementById("material").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),added=[];rows.forEach((line,i)=>{let p=line.split("|").map(x=>x.trim()),term="",definition="",s="Imported Course",u="Imported material";if(p.length>=2){[term,definition]=p;s=p[2]||s;u=p[3]||u}else{let c=line.indexOf(":");if(c>0){term=line.slice(0,c).trim();definition=line.slice(c+1).trim()}}if(term&&definition.length>=8)added.push({id:`custom-${Date.now()}-${i}`,term,definition,section:s,unit:u})});if(!added.length){document.getElementById("msg").textContent="Use Term | Definition on each line.";return}customConcepts.push(...added);localStorage.setItem("it-practice-custom-concepts",JSON.stringify(customConcepts));queueCloudSave();document.getElementById("material").value="";document.getElementById("msg").textContent=`${added.length} concepts added, creating ${added.length*6} new questions.`;document.getElementById("bankCount").textContent=`● ${questions().length.toLocaleString()} questions ready`}}
    updateSyncUi();if(cloudSession)syncCloud().catch(()=>{});render();
  </script>
</body>
</html>
